services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credito
      POSTGRES_PASSWORD: credito
      POSTGRES_DB: mini_credito
    volumes:
      - ./db/crear_base_de_tests.sql:/docker-entrypoint-initdb.d/crear_base_de_tests.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credito -d mini_credito"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://credito:credito@db:5432/mini_credito
      TEST_DATABASE_URL: postgresql+psycopg://credito:credito@db:5432/mini_credito_test
    ports:
      - "8000:8000"
    volumes:
      - ./api:/api
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    depends_on:
      - api

volumes:
  web_node_modules:
